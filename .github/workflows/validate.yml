name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest
        run: python -m json.tool manifest.json >/dev/null
      - name: Compile Python sources
        run: python -m py_compile bin/disk-health bin/disk-health-collect bin/disk-health-notify
      - name: Validate installer syntax
        run: bash -n install.sh
      - name: Reject private collector fixtures
        run: test ! -e sample-state.json
