name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate manifest
        run: python -m json.tool manifest.json >/dev/null
      - name: Compile Python sources
        run: python -m py_compile bin/disk-status bin/disk-status-collect bin/disk-status-notify
      - name: Run core regression tests
        run: python -m unittest discover -s tests -v
      - name: Test installer migration and idempotency
        run: bash tests/test_install.sh
      - name: Validate installer syntax
        run: bash -n install.sh
      - name: Reject private collector fixtures
        run: test ! -e sample-state.json
